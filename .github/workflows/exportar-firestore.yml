name: Exportar Firestore a JSON

# Se ejecuta cada 20 minutos y también a mano desde la pestaña "Actions"
# para reflejar de inmediato un cambio del panel en el sitio público.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

# Evita que importación y exportación se ejecuten al mismo tiempo
concurrency:
  group: firestore-sync

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install
        working-directory: scripts

      - name: Exportar colecciones de Firestore
        run: node exportar-firestore.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Confirmar y subir cambios si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en data/; no hay nada que subir."
            exit 0
          fi
          git commit -m "Actualizar datos exportados de Firestore"
          # Integra con rebase los commits nuevos de main para que el push
          # no falle con "non-fast-forward".
          git pull --rebase origin main
          git push
