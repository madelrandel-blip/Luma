name: Importar JSON a Firestore

# Sube los JSON de data/ a Firestore cuando se modifican en el repositorio,
# o a mano desde la pestaña "Actions".
# No se programa por horario: una importación periódica sobrescribiría con
# datos antiguos las ediciones hechas en el panel antes de la siguiente exportación.

on:
  push:
    paths:
      - "data/*.json"
  workflow_dispatch: {}

# Evita que importación y exportación se ejecuten al mismo tiempo
concurrency:
  group: firestore-sync

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install
        working-directory: scripts

      - name: Importar JSON a Firestore
        run: node importar-firestore.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
